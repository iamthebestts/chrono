name: ci

on:
  pull_request_target:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    environment: ${{ github.event_name == 'pull_request_target' && 'integration' ||
      'trunk' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Cache aftman tools
        uses: actions/cache@v4
        with:
          path: ~/.aftman
          key: aftman-${{ hashFiles('aftman.toml') }}

      - name: Install aftman
        uses: ok-nick/setup-aftman@v0.4.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tool check
        run: aftman --version

      - name: Install dependencies
        run: wally install

      - name: Format check (stylua)
        run: stylua --check src

      - name: Lint (selene)
        run: selene src

      - name: Generate sourcemap
        run: rojo sourcemap test.project.json --output sourcemap.json

      - name: Download Roblox type definitions
        run: curl -sSfL -o globalTypes.d.luau
          https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.luau

      - name: Type check (luau-lsp)
        run: luau-lsp analyze --sourcemap=sourcemap.json
          --definitions=globalTypes.d.luau --base-luaurc=.luaurc
          --ignore="**/DevPackages/**" src

      - name: Build
        run: lute build

      - name: Analyze
        run: lute analyze

      - name: Tests
        env:
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: lute tests
